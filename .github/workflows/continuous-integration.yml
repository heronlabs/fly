name: 'Continuous Integration'

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: 'Install & Build'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

  audit:
    needs: install
    name: 'Audit & Supply Chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm dep:cruise

      - run: pnpm audit --audit-level=high

  lint:
    needs: install
    name: 'Lint'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:check

  unit:
    needs: install
    name: 'Unit Tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: pnpm test:unit

      - run: pnpm test:di

      - if: always()
        name: Upload unit-test coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-coverage
          path: reports/vitest/
          retention-days: 14
          if-no-files-found: warn

  # The release secrets only reach main, so this signs the way the CD dmg job
  # does, with a throwaway certificate, to break the release path in a pull
  # request instead of after the merge.
  signing:
    needs: install
    name: 'Release Signing'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Signing keychain
        run: |
          CERT="$RUNNER_TEMP/cert"
          sh scripts/make-signing-cert.sh "$CERT"
          KEYCHAIN=$(MAC_CERT_P12=$(base64 -i "$CERT/fly-signing.p12") \
            MAC_CERT_PASSWORD=$(cat "$CERT/fly-signing.password") \
            sh scripts/signing-keychain.sh "$RUNNER_TEMP")
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - run: pnpm dist

      - name: Delete the signing keychain
        if: always()
        run: '[ -z "${CSC_KEYCHAIN:-}" ] || security delete-keychain "$CSC_KEYCHAIN"'

      - name: Check the signature
        run: |
          codesign -d -r- dist/mac-arm64/fly.app
          codesign -dvv dist/mac-arm64/fly.app 2>&1 | grep '^Authority='

  mutation:
    needs: unit
    name: 'Mutation Tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Mutation tests
        run: |
          set -o pipefail
          pnpm test:mutation 2>&1 | tee "$RUNNER_TEMP/mutation.log"

      - name: Mutation summary
        if: always()
        run: |
          score=$(awk -F'|' '/^All files/ {gsub(/ /, "", $2); print $2; exit}' "$RUNNER_TEMP/mutation.log" 2>/dev/null)
          {
            echo "### Mutation testing"
            echo '```'
            if [ -n "$score" ]; then
              echo "Mutation score: ${score}%"
            else
              echo "see uploaded mutation-reports artifact"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        name: Upload mutation reports
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: warn
