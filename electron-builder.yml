appId: com.heronlabs.fly
productName: fly
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: bin/fly
    to: bin/fly
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64]
  identity: '-'
  sign: ./scripts/sign-mac.ts
  hardenedRuntime: false
  category: public.app-category.developer-tools
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: deb
  executableName: fly
  category: Development
  maintainer: Heron Labs <org@heronlabs.com.br>
  extraResources:
    - from: build/icon.png
      to: icon.png
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
  recommends: [git, tmux]
